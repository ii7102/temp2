server:
  port: 8081

spring:
  application:
    name: pulsefit-backend
  datasource:
    url: ${APP_DB_URL}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    audience: ${JWT_AUDIENCE:pulsefit-backend}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    realm: ${KEYCLOAK_REALM:pulsefit}
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:change-me}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-pack-price-id: ${STRIPE_PRICE_ID_MONTHLY_PACK:}
    drop-in-price-id: ${STRIPE_PRICE_ID_DROP_IN:}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost}
